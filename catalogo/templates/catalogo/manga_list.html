{% extends 'catalogo/base.html' %}

{% block content %}
<h2 class="mb-4">Catálogo de Mangas</h2>
<div class="row">
    {% for manga in mangas %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ manga.titulo }}</h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ manga.categoria.nombre }}</h6>
                <p class="card-text">Precio: ${{ manga.precio }}</p>
                <a href="{% url 'manga_detail' manga.pk %}" class="btn btn-primary btn-sm">Ver Detalle</a>
                <a href="{% url 'manga_update' manga.pk %}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{% url 'manga_delete' manga.pk %}" class="btn btn-danger btn-sm">Eliminar</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
