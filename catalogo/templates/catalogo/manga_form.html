{% extends 'catalogo/base.html' %}

{% block content %}
<h2 class="mb-4">{% if object %}Editar{% else %}Nuevo{% endif %} Manga</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success mt-3">Guardar</button>
            <a href="{% url 'manga_list' %}" class="btn btn-secondary mt-3 ms-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
