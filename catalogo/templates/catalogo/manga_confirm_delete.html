{% extends 'catalogo/base.html' %}

{% block content %}
<div class="alert alert-danger mt-4" role="alert">
    <h4 class="alert-heading">Eliminar Manga</h4>
    <p>¿Estás seguro de que deseas eliminar permanentemente el manga "<strong>{{ manga.titulo }}</strong>"? Esta acción no se puede deshacer.</p>
    <hr>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'manga_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
